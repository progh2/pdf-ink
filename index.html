<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>필기웹</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f6f5e'/%3E%3Cpath d='M18 40c8-14 20-14 28 0' fill='none' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <input id="file-input" type="file" accept="application/pdf,.pdf" hidden />
      <p class="banner" id="banner" hidden></p>

      <section class="upload-screen" id="upload-screen">
        <div class="upload-stack">
          <button type="button" class="dropzone" id="dropzone">
            PDF만 올려요
          </button>
          <ul class="recents" id="recents" hidden></ul>
        </div>
      </section>

      <section class="write-screen" id="write-screen" hidden data-toolbar="top" data-view="page">
        <div class="write-top">
          <button type="button" class="other-pdf" id="other-pdf">다른 PDF</button>
          <h1 class="doc-title" id="doc-title"></h1>
          <div class="write-top-end">
            <button type="button" class="interact-lock" id="interact-btn" aria-label="편집" aria-pressed="false">
              <span class="interact-lock-icon" aria-hidden="true">
                <svg class="lock-closed" viewBox="0 0 24 24" hidden>
                  <rect x="6" y="11" width="12" height="9" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.8" />
                  <path d="M8.5 11V8.4a3.5 3.5 0 0 1 7 0V11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                </svg>
                <svg class="lock-open" viewBox="0 0 24 24">
                  <rect x="6" y="11" width="12" height="9" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.8" />
                  <path d="M15.5 11V8.4a3.5 3.5 0 0 0-7 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                </svg>
              </span>
              <span class="interact-lock-label">편집</span>
            </button>
            <div class="page-pager">
              <button type="button" class="page-step" id="prev-btn" aria-label="이전 페이지">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M14.5 6 8.5 12l6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
              <span class="page-label" id="page-label">1 / 1</span>
              <button type="button" class="page-step" id="next-btn" aria-label="다음 페이지">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M9.5 6 15.5 12l-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
            </div>
          </div>
        </div>

        <div class="write-body">
          <div class="toolbar-rail" id="toolbar-rail">
            <div class="toolbar" id="toolbar">
              <button type="button" class="toolbar-grip" id="toolbar-grip" aria-label="툴바 옮기기">
                <span></span>
                <span></span>
                <span></span>
              </button>
              <div class="toolbar-cells">
                <button type="button" class="tool ink-tool is-selected" id="pen-btn" data-tool="pen" aria-label="펜">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M14.2 4.8 19.2 9.8 8.8 20.2H4v-4.8L14.2 4.8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
                    <path d="M12.8 6.2 17.8 11.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                  </svg>
                  <span class="tool-dot" aria-hidden="true"></span>
                </button>
                <button type="button" class="tool ink-tool" id="highlighter-btn" data-tool="highlighter" aria-label="형광펜">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M7 20h5.2L20 8.8l-5.4-3.8L6.4 16.4V20z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
                    <path d="M8.2 16.2 13.6 8.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                  </svg>
                  <span class="tool-dot" aria-hidden="true"></span>
                </button>
                <button type="button" class="tool ink-tool" id="pencil-btn" data-tool="pencil" aria-label="색연필">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M14 5.2 18.8 10 8.6 20.2H4v-4.6L14 5.2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
                    <path d="M12.6 6.6 17.4 11.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                    <path d="M4.4 15.8 8.4 19.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                  </svg>
                  <span class="tool-dot" aria-hidden="true"></span>
                </button>
                <button type="button" class="tool" id="eraser-btn" data-tool="eraser" aria-label="지우개">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      d="M6.2 13.2 12.8 6.6a2 2 0 0 1 2.8 0l2 2a2 2 0 0 1 0 2.8l-7.4 7.4H6.2l-2-2a2 2 0 0 1 0-2.8l2-2z"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.8"
                      stroke-linejoin="round"
                    />
                    <path d="M9 20h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                  </svg>
                </button>
                <button type="button" class="tool" id="select-btn" data-tool="select" aria-label="선택">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="4.5" y="4.5" width="15" height="15" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="2.8 2.2" />
                  </svg>
                </button>
                <button type="button" class="tool ink-tool" id="stamp-btn" data-tool="stamp" aria-label="스탬프">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <ellipse cx="12" cy="12" rx="8.2" ry="5.2" fill="none" stroke="currentColor" stroke-width="1.8" />
                    <ellipse cx="12" cy="12" rx="6.2" ry="3.4" fill="none" stroke="currentColor" stroke-width="1.2" />
                  </svg>
                </button>
                <button type="button" class="tool" id="preview-btn" aria-label="미리보기">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3.5" y="4.5" width="7" height="15" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.8" />
                    <rect x="13.5" y="4.5" width="7" height="15" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.8" />
                  </svg>
                </button>
                <button type="button" class="tool" id="undo-btn" aria-label="되돌리기" disabled>
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M8 8H5.5a.5.5 0 0 0-.5.5V11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                    <path d="M6 9.5c1.6-2.6 4.4-4 7.4-3.6 3.4.4 6 3.2 6.2 6.6.2 3.6-2.5 6.8-6 7.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                  </svg>
                </button>
                <button type="button" class="tool" id="redo-btn" aria-label="다시 실행" disabled>
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M16 8h2.5a.5.5 0 0 1 .5.5V11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                    <path d="M18 9.5c-1.6-2.6-4.4-4-7.4-3.6-3.4.4-6 3.2-6.2 6.6-.2 3.6 2.5 6.8 6 7.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                  </svg>
                </button>
                <button type="button" class="tool" id="more-btn" aria-label="더보기">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="6.5" cy="12" r="1.4" fill="currentColor" />
                    <circle cx="12" cy="12" r="1.4" fill="currentColor" />
                    <circle cx="17.5" cy="12" r="1.4" fill="currentColor" />
                  </svg>
                </button>
              </div>
            </div>
          </div>

          <div id="write-split">
            <div class="workspace" id="workspace">
              <div class="viewport" id="viewport">
                <div class="page-stack" id="page-stack"></div>
              </div>
            </div>
            <div class="split-pane" id="split-pane" hidden>
              <div class="split-tabs" id="split-tabs"></div>
              <div class="split-stage" id="split-stage"></div>
            </div>
          </div>
        </div>
      </section>

      <div class="slot-panel" id="slot-panel" hidden>
        <div class="slot-kinds" id="slot-kinds" hidden>
          <button type="button" data-kind="pen">펜</button>
          <button type="button" data-kind="highlighter">형광</button>
          <button type="button" data-kind="pencil">색연필</button>
          <button type="button" data-kind="stamp">스탬프</button>
        </div>
        <div class="slot-palette" id="slot-palette"></div>
        <div class="slot-stamp" id="slot-stamp" hidden>
          <canvas class="stamp-preview" id="stamp-preview" aria-hidden="true"></canvas>
          <div class="stamp-phrases" id="stamp-phrases"></div>
        </div>
        <div class="slot-opacity-row" id="slot-opacity-row" hidden>
          <input id="slot-opacity" type="range" min="1" max="100" step="1" value="40" aria-label="투명도" />
        </div>
        <div class="slot-width-row" id="slot-width-row">
          <input id="slot-width" type="range" min="1" max="10" step="1" aria-label="굵기" />
        </div>
      </div>

      <div class="slot-panel more-panel" id="more-panel" hidden>
        <button type="button" data-more="fullscreen" id="fullscreen-item">전체화면</button>
        <button type="button" data-more="image">이미지</button>
        <button type="button" data-more="sticker">스티커</button>
        <div class="more-rotate">
          <button type="button" data-rotate="-90">왼쪽</button>
          <button type="button" data-rotate="90">오른쪽</button>
        </div>
        <button type="button" data-more="save">저장</button>
        <button type="button" data-more="export">내보내기</button>
        <button type="button" data-more="settings" id="settings-btn">설정</button>
      </div>

      <input id="image-input" type="file" accept="image/png,image/jpeg,image/webp,.png,.jpg,.jpeg,.webp" hidden />

      <aside class="preview-drawer" id="preview-drawer" hidden>
        <div class="preview-grip" id="preview-grip" aria-hidden="true"></div>
        <div class="preview-head">
          <h2>미리보기</h2>
          <button type="button" class="preview-close" id="preview-close" aria-label="미리보기 닫기">닫기</button>
        </div>
        <div class="preview-tabs" id="preview-tabs">
          <button type="button" data-preview-tab="pages">페이지</button>
          <button type="button" data-preview-tab="toc">목차</button>
        </div>
        <div class="preview-pages" id="preview-pages">
          <div class="preview-filters" id="preview-filters">
            <button type="button" data-preview-filter="all">전체</button>
            <button type="button" data-preview-filter="bookmarks">책갈피</button>
            <button type="button" data-preview-filter="outline">빈 쪽</button>
          </div>
          <div class="preview-list" id="preview-list">
            <div class="preview-drop" id="preview-drop" hidden></div>
          </div>
          <button type="button" class="preview-insert" id="outline-insert">빈 쪽 넣기</button>
        </div>
        <div class="preview-toc" id="preview-toc" hidden>
          <button type="button" class="preview-toc-add" id="toc-add" aria-label="목차 항목 추가">+</button>
          <div class="preview-toc-list" id="toc-list"></div>
        </div>
      </aside>
      <div class="sticker-sheet" id="sticker-sheet" hidden>
        <div class="sticker-head">
          <p class="sticker-title">스티커</p>
          <button type="button" class="sticker-close" id="sticker-close" aria-label="닫기">✕</button>
        </div>
        <div class="sticker-body">
          <div class="sticker-make" id="sticker-make">
            <button type="button" class="sticker-drop" id="sticker-drop">
              <span id="sticker-drop-label">그림을 골라 영역을 잘라요</span>
            </button>
            <div class="sticker-source" id="sticker-source" hidden>
              <canvas class="sticker-canvas" id="sticker-canvas"></canvas>
              <div class="sticker-regions" id="sticker-regions"></div>
            </div>
            <div class="sticker-make-actions" id="sticker-make-actions" hidden>
              <button type="button" class="sticker-flat" id="sticker-whole">전체 넣기</button>
              <button type="button" class="sticker-flat" id="sticker-cut">영역 넣기</button>
            </div>
          </div>

          <div class="sticker-folders" id="sticker-folders"></div>
          <div class="sticker-grid" id="sticker-grid"></div>

          <div class="sticker-studio" id="sticker-studio" hidden>
            <div class="sticker-studio-stage">
              <div class="sticker-studio-box" id="sticker-studio-box">
                <canvas class="sticker-studio-canvas" id="sticker-studio-canvas"></canvas>
                <span class="sticker-handle" data-handle="nw"></span>
                <span class="sticker-handle" data-handle="ne"></span>
                <span class="sticker-handle" data-handle="se"></span>
                <span class="sticker-handle" data-handle="sw"></span>
              </div>
            </div>
            <div class="sticker-tools" id="sticker-tools">
              <button type="button" data-studio="chroma" aria-label="투명">투명</button>
              <button type="button" data-studio="eraser" aria-label="지우개">지우개</button>
              <button type="button" data-studio="rotate" aria-label="회전">회전</button>
            </div>
            <input type="range" class="sticker-angle" id="sticker-angle" min="0" max="359" value="0" hidden />
            <div class="sticker-studio-actions">
              <button type="button" class="sticker-flat" id="sticker-save">저장</button>
              <button type="button" class="sticker-flat" id="sticker-delete">삭제</button>
            </div>
          </div>
        </div>
        <input type="file" id="sticker-file" accept="image/png,image/jpeg,image/webp" hidden />
      </div>
      <button type="button" class="sticker-backdrop" id="sticker-backdrop" hidden aria-label="스티커 닫기"></button>

      <div class="page-menu" id="toc-menu" hidden>
        <button type="button" data-toc-menu="rename">이름 변경</button>
        <button type="button" data-toc-menu="delete">삭제</button>
      </div>

      <div class="page-menu" id="lock-menu" hidden>
        <button type="button" data-lock-menu="unlock">고정 해제</button>
      </div>

      <div class="page-menu" id="sticker-menu" hidden>
        <button type="button" data-sticker-menu="edit">편집</button>
        <button type="button" data-sticker-menu="delete">삭제</button>
      </div>

      <div class="page-menu" id="page-menu" hidden>
        <button type="button" data-page-menu="copy">복사</button>
        <button type="button" data-page-menu="paste">붙여넣기</button>
        <button type="button" data-page-menu="duplicate">복제</button>
        <button type="button" data-page-menu="delete">삭제</button>
        <button type="button" data-page-menu="up">위로</button>
        <button type="button" data-page-menu="down">아래로</button>
        <button type="button" data-page-menu="left">왼쪽 90°</button>
        <button type="button" data-page-menu="right">오른쪽 90°</button>
      </div>

      <div class="marquee" id="marquee" hidden>
        <div class="marquee-box" id="marquee-box"></div>
        <div class="marquee-menu" id="marquee-menu" hidden>
          <button type="button" data-marquee="copy">복사</button>
          <button type="button" data-marquee="duplicate">복제</button>
          <button type="button" data-marquee="delete">삭제</button>
          <button type="button" data-marquee="capture">캡처</button>
          <button type="button" data-marquee="mosaic">마스킹</button>
          <button type="button" data-marquee="link">연결</button>
        </div>
      </div>

      <div class="area-layer" id="area-layer" hidden></div>
      <div class="slot-panel area-link-panel" id="area-link-panel" hidden>
        <p class="area-link-label">이 문서</p>
        <div class="area-link-page-row">
          <input id="area-link-page" type="number" min="1" step="1" inputmode="numeric" aria-label="페이지" />
          <button type="button" id="area-link-page-go">쪽</button>
        </div>
        <p class="area-link-label">다른 PDF</p>
        <div class="area-link-docs" id="area-link-docs"></div>
        <p class="area-link-label">웹 주소</p>
        <div class="area-link-url-row">
          <input id="area-link-url" type="url" placeholder="https://" aria-label="웹 주소" />
          <button type="button" id="area-link-url-go">열기</button>
        </div>
      </div>

      <div class="select-layer" id="select-layer" hidden>
        <div class="select-box" id="select-box">
          <span class="select-handle" data-handle="nw"></span>
          <span class="select-handle" data-handle="ne"></span>
          <span class="select-handle" data-handle="se"></span>
          <span class="select-handle" data-handle="sw"></span>
          <span class="select-handle" data-handle="rotate" aria-label="회전"></span>
        </div>
      </div>
      <div class="select-hud float-bar" id="float-bar" hidden>
        <button type="button" id="copy-btn">복사</button>
        <button type="button" id="paste-btn">붙여넣기</button>
        <button type="button" id="delete-btn">삭제</button>
        <button type="button" id="crop-btn" hidden>크롭</button>
        <button type="button" id="lock-btn" hidden>고정</button>
        <button type="button" id="crop-confirm" hidden>적용</button>
      </div>
      <div class="shape-chips" id="shape-chips" hidden>
        <button type="button" data-shape="line" aria-label="직선">직선</button>
        <button type="button" data-shape="rect" aria-label="사각">사각</button>
        <button type="button" data-shape="circle" aria-label="원">원</button>
      </div>

      <div class="slot-panel eraser-panel" id="eraser-panel" hidden>
        <div class="choice-row choice-2" id="eraser-mode-choices">
          <button type="button" data-erase-mode="pixel">픽셀 지우개</button>
          <button type="button" data-erase-mode="stroke">획 지우개</button>
        </div>
        <div class="slot-width-row">
          <input id="eraser-width" type="range" min="1" max="10" step="1" aria-label="지우개 굵기" />
        </div>
      </div>

      <div class="sheet" id="settings-sheet" hidden>
        <button type="button" class="sheet-backdrop" id="settings-backdrop" aria-label="설정 닫기"></button>
        <div class="sheet-card" role="dialog" aria-labelledby="settings-title">
          <h2 id="settings-title">설정</h2>
          <div class="setting-block">
            <p class="setting-label">툴바 위치</p>
            <div class="choice-row choice-5" id="toolbar-pos-choices">
              <button type="button" data-pos="top">위</button>
              <button type="button" data-pos="left">왼쪽</button>
              <button type="button" data-pos="right">오른쪽</button>
              <button type="button" data-pos="bottom">아래</button>
              <button type="button" data-pos="float">떠 있게</button>
            </div>
          </div>
          <div class="setting-block">
            <p class="setting-label">보기</p>
            <div class="choice-row choice-2" id="view-mode-choices">
              <button type="button" data-view="page">페이지</button>
              <button type="button" data-view="scroll">세로 스크롤</button>
            </div>
          </div>
          <div class="setting-block setting-switch">
            <span class="setting-label-inline">펜만</span>
            <button type="button" class="pen-only" id="pen-only-btn" aria-label="펜만" aria-pressed="false">
              <span class="pen-only-label">펜만</span>
              <span class="pen-only-track" aria-hidden="true">
                <span class="pen-only-knob"></span>
              </span>
            </button>
          </div>
          <div class="setting-block setting-switch">
            <span class="setting-label-inline">배율 고정</span>
            <button type="button" class="pen-only" id="zoom-lock-btn" aria-label="배율 고정" aria-pressed="false">
              <span class="pen-only-label">고정</span>
              <span class="pen-only-track" aria-hidden="true">
                <span class="pen-only-knob"></span>
              </span>
            </button>
          </div>
          <button type="button" class="sheet-done" id="settings-done">확인</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
