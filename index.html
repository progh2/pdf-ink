<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>필기웹</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f6f5e'/%3E%3Cpath d='M18 40c8-14 20-14 28 0' fill='none' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <input id="file-input" type="file" accept="application/pdf,.pdf" hidden />
      <p class="banner" id="banner" hidden></p>

      <section class="upload-screen" id="upload-screen">
        <div class="upload-stack">
          <button type="button" class="dropzone" id="dropzone">
            PDF만 올려요
          </button>
          <ul class="recents" id="recents" hidden></ul>
        </div>
      </section>

      <section class="write-screen" id="write-screen" hidden data-toolbar="top" data-view="page">
        <div class="write-top">
          <button type="button" class="other-pdf" id="other-pdf">다른 PDF</button>
          <h1 class="doc-title" id="doc-title"></h1>
          <div class="write-top-end">
            <button type="button" class="zoom-lock" id="zoom-lock-btn" aria-label="배율 고정" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="6" y="11" width="12" height="9" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.8" />
                <path d="M8.5 11V8.4a3.5 3.5 0 0 1 7 0V11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              </svg>
            </button>
            <span class="page-label" id="page-label">1 / 1</span>
          </div>
        </div>

        <div class="write-body">
          <div class="toolbar-rail">
            <div class="toolbar" id="toolbar">
              <button type="button" class="tool slot is-selected" data-slot="0" aria-label="슬롯 1">
                <span class="slot-mark">
                  <span class="slot-ring"></span>
                  <span class="slot-dot"></span>
                </span>
              </button>
              <button type="button" class="tool slot" data-slot="1" aria-label="슬롯 2">
                <span class="slot-mark">
                  <span class="slot-ring"></span>
                  <span class="slot-dot"></span>
                </span>
              </button>
              <button type="button" class="tool slot" data-slot="2" aria-label="슬롯 3">
                <span class="slot-mark">
                  <span class="slot-ring"></span>
                  <span class="slot-dot"></span>
                </span>
              </button>
              <button type="button" class="tool stamp-tool" id="stamp-btn" aria-label="스탬프">
                <span class="stamp-mini"></span>
              </button>
              <button type="button" class="tool" id="eraser-btn" data-tool="eraser" aria-label="지우개">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M6.2 13.2 12.8 6.6a2 2 0 0 1 2.8 0l2 2a2 2 0 0 1 0 2.8l-7.4 7.4H6.2l-2-2a2 2 0 0 1 0-2.8l2-2z"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linejoin="round"
                  />
                  <path d="M9 20h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                </svg>
              </button>
              <button type="button" class="tool" id="prev-btn" aria-label="이전 페이지">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M14.5 6 8.5 12l6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
              <button type="button" class="tool" id="next-btn" aria-label="다음 페이지">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M9.5 6 15.5 12l-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
              <button type="button" class="tool" id="settings-btn" aria-label="설정">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M5 8h14M5 16h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                  <circle cx="9" cy="8" r="2.1" fill="none" stroke="currentColor" stroke-width="1.8" />
                  <circle cx="15" cy="16" r="2.1" fill="none" stroke="currentColor" stroke-width="1.8" />
                </svg>
              </button>
            </div>
          </div>

          <div class="workspace" id="workspace">
            <div class="viewport" id="viewport">
              <div class="page-stack" id="page-stack"></div>
            </div>
          </div>
        </div>
      </section>

      <div class="slot-panel" id="slot-panel" hidden>
        <div class="slot-kinds" id="slot-kinds">
          <button type="button" data-kind="pen">펜</button>
          <button type="button" data-kind="highlighter">형광</button>
          <button type="button" data-kind="pencil">색연필</button>
        </div>
        <div class="slot-palette" id="slot-palette"></div>
        <div class="slot-opacity-row" id="slot-opacity-row" hidden>
          <input id="slot-opacity" type="range" min="1" max="100" step="1" value="40" aria-label="투명도" />
        </div>
        <div class="slot-width-row" id="slot-width-row">
          <input id="slot-width" type="range" min="1" max="10" step="1" aria-label="굵기" />
        </div>
      </div>

      <div class="slot-panel stamp-panel" id="stamp-panel" hidden>
        <div class="stamp-phrases" id="stamp-phrases"></div>
      </div>

      <div class="slot-panel eraser-panel" id="eraser-panel" hidden>
        <div class="choice-row choice-2" id="eraser-mode-choices">
          <button type="button" data-erase-mode="pixel">픽셀 지우개</button>
          <button type="button" data-erase-mode="stroke">획 지우개</button>
        </div>
        <div class="slot-width-row">
          <input id="eraser-width" type="range" min="1" max="10" step="1" aria-label="지우개 굵기" />
        </div>
      </div>

      <div class="sheet" id="settings-sheet" hidden>
        <button type="button" class="sheet-backdrop" id="settings-backdrop" aria-label="설정 닫기"></button>
        <div class="sheet-card" role="dialog" aria-labelledby="settings-title">
          <h2 id="settings-title">설정</h2>
          <div class="setting-block">
            <p class="setting-label">툴바 위치</p>
            <div class="choice-row choice-4" id="toolbar-pos-choices">
              <button type="button" data-pos="top">위</button>
              <button type="button" data-pos="left">왼</button>
              <button type="button" data-pos="right">오</button>
              <button type="button" data-pos="bottom">아래</button>
            </div>
          </div>
          <div class="setting-block">
            <p class="setting-label">보기</p>
            <div class="choice-row choice-2" id="view-mode-choices">
              <button type="button" data-view="page">페이지</button>
              <button type="button" data-view="scroll">세로 스크롤</button>
            </div>
          </div>
          <div class="setting-block setting-switch">
            <span class="setting-label-inline">펜만</span>
            <button type="button" class="pen-only" id="pen-only-btn" aria-label="펜만" aria-pressed="false">
              <span class="pen-only-label">펜만</span>
              <span class="pen-only-track" aria-hidden="true">
                <span class="pen-only-knob"></span>
              </span>
            </button>
          </div>
          <button type="button" class="sheet-done" id="settings-done">확인</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
